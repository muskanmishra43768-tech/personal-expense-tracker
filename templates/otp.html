<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP | Smart Study Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2,#ff758c)}.card{width:410px;max-width:92%;padding:40px;background:#fff;border-radius:25px;box-shadow:0 25px 60px rgba(0,0,0,.25);text-align:center}.icon{font-size:55px}.title{font-size:29px;font-weight:700;color:#4f46e5;margin:8px 0}.sub{color:#666;line-height:1.5;margin-bottom:18px}.email{font-size:13px;color:#666;margin-bottom:18px}.otp-box{background:#eef2ff;border:1px dashed #667eea;border-radius:14px;padding:12px;margin-bottom:18px}.otp-box b{font-size:24px;letter-spacing:5px;color:#4f46e5}.label{font-size:12px;color:#666}.error{background:#ffe7e7;color:#b42318;padding:10px;border-radius:10px;margin-bottom:15px;font-size:14px}input{width:100%;padding:15px;border:2px solid #e5e7eb;border-radius:12px;font-size:22px;text-align:center;letter-spacing:7px;outline:none}input:focus{border-color:#667eea}.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}.back{display:inline-block;margin-top:18px;color:#4f46e5;text-decoration:none;font-weight:bold;font-size:14px}
</style>
<style>

/* ===== Pastel refresh: OTP verification ===== */
:root {
    --otp-ink: #342a40;
    --otp-muted: #81768a;
    --otp-pink: #f3a5c3;
    --otp-peach: #ffd0b9;
    --otp-mint: #c3eddf;
    --otp-lilac: #d9ceff;
}
html { min-height: 100%; }
body {
    min-height: 100vh;
    margin: 0;
    color: var(--otp-ink);
    background:
        radial-gradient(circle at 8% 12%, rgba(243,165,195,.38), transparent 28%),
        radial-gradient(circle at 90% 82%, rgba(195,237,223,.48), transparent 30%),
        #fff8fb !important;
    position: relative;
}
body::before {
    content: "₹   $   €   ◉   ₹   $   ¢";
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
    pointer-events: none;
    color: rgba(100, 69, 99, .075);
    font-size: clamp(3rem, 10vw, 8rem);
    font-weight: 900;
    letter-spacing: .12em;
    transform: rotate(-18deg);
    white-space: normal;
    overflow-wrap: anywhere;
}
body > * { position: relative; z-index: 1; }
.otp-container {
    border-radius: 28px !important;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(67, 42, 71, .14) !important;
    border: 1px solid rgba(230, 195, 214, .85);
    background: rgba(255,255,255,.92) !important;
}
.left-panel {
    background: linear-gradient(145deg, #382d46 0%, #58415f 58%, #79556e 100%) !important;
    color: #fff !important;
}
.logo, .left-content h1 { color: #fff !important; }
.left-content h1 span { color: #ffc4da !important; }
.left-content p { color: rgba(255,255,255,.84) !important; }
.security-card {
    background: rgba(255,255,255,.10) !important;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 16px !important;
    color: #fff !important;
    backdrop-filter: blur(8px);
}
.security-card span { color: rgba(255,255,255,.8) !important; }
.right-panel { background: rgba(255,255,255,.95) !important; }
.otp-box {
    background: transparent !important;
    color: var(--otp-ink) !important;
}
.otp-box h2 { color: var(--otp-ink) !important; }
.subtitle, .otp-box p { color: var(--otp-muted); }
.otp-input, .otp-inputs input, input[type="text"], input[type="number"] {
    border: 1px solid #ead6e4 !important;
    border-radius: 13px !important;
    background: #fffafd !important;
    color: var(--otp-ink) !important;
    transition: border-color .2s ease, box-shadow .2s ease;
}
.otp-input:focus, .otp-inputs input:focus, input[type="text"]:focus, input[type="number"]:focus {
    outline: none;
    border-color: #e89dbd !important;
    box-shadow: 0 0 0 4px rgba(243,165,195,.18) !important;
}
button, .btn, button[type="submit"], input[type="submit"] {
    border: 0;
    border-radius: 13px !important;
    background: linear-gradient(100deg, #e991b7, #f6b79f) !important;
    color: #392b43 !important;
    font-weight: 800 !important;
    box-shadow: 0 9px 22px rgba(233,145,183,.22);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
}
button:hover, .btn:hover, button[type="submit"]:hover, input[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 13px 28px rgba(233,145,183,.3);
}
a { color: #bb6390 !important; }
.flash-message, .alert, .message {
    border-radius: 12px !important;
}
@media (max-width: 850px) {
    .otp-container { width: min(100% - 24px, 560px) !important; }
    .left-panel { min-height: 260px; }
}
@media (max-width: 500px) {
    body { padding: 12px !important; box-sizing: border-box; }
    .otp-container { width: 100% !important; border-radius: 20px !important; }
}

</style>
</head>
<body><div class="card"><div class="icon">🔐</div><div class="title">Verify OTP</div><div class="sub">Enter the 6-digit OTP to continue.</div>{% if email %}<div class="email">Account: <b>{{ email }}</b></div>{% endif %}{% if error %}<div class="error">{{ error }}</div>{% endif %}{% if demo_otp %}<div class="otp-box"><div class="label">Your OTP (demo mode)</div><b>{{ demo_otp }}</b></div>{% endif %}<form method="POST"><input name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autofocus placeholder="••••••"><button class="btn" type="submit">Verify OTP ✓</button></form><a class="back" href="/login">← Back to Login</a></div></body></html>
